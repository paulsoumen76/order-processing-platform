spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/inventory_db
    username: inventory_user
    password: inventory_password

  kafka:
    bootstrap-servers: kafka:9092

  data:
    redis:
      host: redis
      port: 6379
management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true